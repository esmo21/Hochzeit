<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anmelden · Hochzeitsplaner</title><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/responsive.css"><script type="module" src="js/login.js"></script></head><body class="page"><main class="login-layout"><section class="login-card hero-card" aria-labelledby="login-title"><p class="eyebrow">Privater Bereich</p><h1 id="login-title">Anmelden</h1><p class="muted">Melde dich mit deiner in Supabase angelegten E-Mail-Adresse an.</p><div id="login-message" hidden></div><form id="login-form" class="form"><div class="form-row"><label for="email">E-Mail-Adresse</label><input class="input" id="email" name="email" type="email" autocomplete="email" required></div><div class="form-row"><label for="password">Passwort</label><input class="input" id="password" name="password" type="password" autocomplete="current-password" required></div><button id="login-submit" class="button button-primary" type="submit">Anmelden</button></form></section></main></body></html>
