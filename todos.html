<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aufgaben · Hochzeitsplaner</title><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/responsive.css"><script type="module" src="js/todos.js"></script></head><body class="page"><a class="skip-link" href="#main">Zum Inhalt springen</a><header class="site-header"><div class="container header-inner"><a class="brand" href="index.html"><img src="assets/icons/heart.svg" alt=""><span>Hochzeitsplaner</span></a><button class="button button-secondary nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu">Menü</button><nav id="nav-menu" class="nav-menu" aria-label="Hauptnavigation"><ul class="nav-list"><li><a class="nav-link" href="index.html">Übersicht</a></li><li><a class="nav-link" href="todos.html">Aufgaben</a></li><li><a class="nav-link" href="geschenke.html">Geschenkwünsche</a></li><li><a class="nav-link" href="gaeste.html">Gästeliste</a></li><li><a class="nav-link" href="planung.html">Tages- & Sitzplan</a></li><li><a class="nav-link" href="standesamt.html">Standesamt</a></li><li><a class="nav-link" href="location.html">Location</a></li><li><a class="nav-link" href="budget.html">Budget</a></li><li><a class="nav-link" href="moodboard.html">Moodboard</a></li><li><a class="nav-link" href="notizen.html">Notizen</a></li><li><button id="logout-button" class="logout-button" type="button">Abmelden</button></li></ul></nav></div></header><main id="main" class="main container"><h1>Aufgaben</h1><p class="lead">Plane, sortiere und erledige alle To-dos rund um eure Hochzeit.</p><div id="todo-message" hidden></div><section class="panel"><h2>Aufgabe erfassen</h2><form id="todo-form" class="form"><input id="todo-id" type="hidden"><div class="grid grid-2"><div class="form-row"><label for="todo-title">Titel</label><input id="todo-title" class="input" required maxlength="180"></div><div class="form-row"><label for="todo-due-date">Fälligkeitsdatum</label><input id="todo-due-date" class="input" type="date"></div></div><div class="form-row"><label for="todo-priority">Priorität</label><select id="todo-priority"><option value="medium">Mittel</option><option value="very_low">Sehr unwichtig</option><option value="low">Unwichtig</option><option value="high">Hoch</option><option value="very_high">Sehr hoch</option></select></div><div class="form-row"><label for="todo-note">Notiz</label><textarea id="todo-note"></textarea></div><div class="actions"><button id="todo-submit" class="button button-primary" type="submit">Aufgabe speichern</button><button id="todo-cancel" class="button button-secondary" type="button">Zurücksetzen</button></div></form></section><section class="toolbar" aria-label="Filter und Sortierung"><div class="form-row"><label for="status-filter">Status filtern</label><select id="status-filter"><option value="all">Alle</option><option value="open">Offen</option><option value="done">Erledigt</option></select></div><div class="form-row"><label for="sort-order">Sortierung</label><select id="sort-order"><option value="default">Offen zuerst, frühestes Datum</option><option value="asc">Datum aufsteigend</option><option value="desc">Datum absteigend</option></select></div></section><section id="todo-list" class="list" aria-live="polite"></section></main><dialog id="confirm-dialog"><div class="dialog-body"><h2>Bitte bestätigen</h2><p id="confirm-message"></p><div class="actions"><button class="button button-danger" data-confirm-yes type="button">Löschen</button><button class="button button-secondary" data-confirm-no type="button">Abbrechen</button></div></div></dialog></body></html>
